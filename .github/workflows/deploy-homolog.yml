name: Deploy Homolog

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image (homolog)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/SistemaBensServicosTur.Web/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:homolog

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/app

            # Pull new image
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull blazor-homolog

            # Make sure postgres is up before running migrations
            docker compose up -d postgres-homolog
            echo "Waiting for postgres..."
            sleep 5

            # Start the app
            docker compose up -d --no-deps blazor-homolog
            docker image prune -f
